# CLA assistant — records contributor agreement to CLA.md on each pull request.
#
# DISABLED BY DEFAULT. This workflow is gated on the repository variable
# CLA_ENABLED == "true" so it does NOT block or error on PRs until the owner
# turns it on after completing setup. Until then it is a no-op.
#
# ── One-time setup (owner) ────────────────────────────────────────────────
# 1. Create a Personal Access Token (classic) with `repo` scope, OR a fine-grained
#    token with Contents + Pull requests: read/write on this repo. This token is
#    used by the action to store signatures and comment on PRs.
# 2. Add it as an Actions secret named PERSONAL_ACCESS_TOKEN
#    (Settings → Secrets and variables → Actions → New repository secret).
# 3. Decide where signatures are stored. Default below stores them in a file
#    `signatures/cla.json` on a branch named `cla-signatures` in THIS repo.
#    (You can point it at a separate private repo instead; see the action docs.)
# 4. Add a repository variable CLA_ENABLED with value `true`
#    (Settings → Secrets and variables → Actions → Variables).
# 5. Review and finalize CLA.md with counsel before enabling.
#
# Pin `@v2.6.1` (or the latest reviewed release) rather than a moving tag.
# Action: https://github.com/contributor-assistant/github-action
# ──────────────────────────────────────────────────────────────────────────

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # No-op until the owner sets the CLA_ENABLED repo variable to "true".
    if: vars.CLA_ENABLED == 'true'
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/ailedger-dev/ailedger/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for your PR. Before it can be merged, please read our [CLA](https://github.com/ailedger-dev/ailedger/blob/main/CLA.md) and sign it by commenting below with the exact sentence shown.'
